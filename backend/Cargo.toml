[package]
name = "rpi-smoker"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
# Web framework and server
axum = "0.8"
tokio = { version = "1.45.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6.6", features = [
    "cors",
    "trace",
    "timeout",
    "compression-gzip",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"

# CLI and configuration
clap = { version = "4.5", features = ["derive"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"

# JSON Patch support
json-patch = "4.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lazy_static = "1.5.0"

# Hardware interface (conditional - only on Linux)
[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.22.1", optional = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
rpi-hardware = ["rppal"]
